[project]
name = "annofabapi-3dpc-extensions"
dynamic = ["version"]
description = "annofabapiの3DPC Editor用の拡張機能です。"
authors = [{ name = "Kurusugawa Computer Inc." }]
requires-python = ">=3.12,<4"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["dataclasses-json", "numpy"]

[project.urls]
Repository = "https://github.com/kurusugawa-computer/annofabapi-3dpc-extensions"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "annofabapi>=0.47.0",
]
linter = [
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "pylint>=4.1.3",
]
documentation = [
    "sphinx>=9.1.1; python_version < '3.13'",
    "sphinx>=9.2.0; python_version >= '3.13'",
    "pydata-sphinx-theme>=0.23.0",
]
dev-only = [
    "numpy>=2.1",
]

[tool.uv]
required-version = ">=0.13.4"
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
default-groups = ["test", "linter", "documentation", "dev-only"]

[tool.mypy]
ignore_missing_imports = true

check_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
ignore = [
    "CPY001", # 既存プロジェクトではファイルごとの著作権表記を行わない
    "G004", # `logging-f-string` : loggingでf-stringを使いたいので無視する
    "PD002", #すでにpandasで`inplace=True`はいろんなところで使っているため
    "RUF001", # 全角記号など`ambiguous unicode character`も使いたいため
    "RUF002",# 全角記号など`ambiguous unicode character`も使いたいため
    "RUF003",# 全角記号など`ambiguous unicode character`も使いたいため
    "PLC1901", # compare-to-empty-string : `if a == "`のように空文字列で直接比較したいときがあるため
    "PLR2004", # magic-value-comparison: listのサイズで判定するときがよくあるため
    "ERA", # : 役立つこともあるが、コメントアウトしていないコードも警告されるので無視する
    "PERF203", # try-except-in-loop: ループ内でtry-exceptを使うこともあるため無視する。
    "FIX", # TODOやFIXMEを使うため無視する
    "TD", # TODOコメントの書き方に気にしていないので無視する

    # 以下のルールはプロジェクトのコードに合っていないので無効化した
    "RSE", # flake8-raise
    "D", # pydocstyle, Docstringを中途半端にしか書いていないので、除外する
    "C90", # mccabe
    "T20", # flake8-print
    "SLF", #  flake8-self
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "TRY", # tryceratops
    "COM", # flake8-commas
    "S", # flake8-bandit
    "EM",#flake8-errmsg
    "EXE", # flake8-executable
    "ICN", # flake8-import-conventions
    "RET",#flake8-return
    "SIM",#flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", #pathlibを使わないコードが多いので、除外する
    "ISC", #flake8-implicit-str-concat
    "N", # pep8-naming
    "PT", # flake8-pytest-style
]

select = [
    "ALL"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
# `typing.Optional`を使っているため、UP007のルールを無視する
# https://beta.ruff.rs/docs/settings/#keep-runtime-typing
keep-runtime-typing = true

[tool.ruff.lint.pylint]
max-args = 10

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["annofab_3dpc"]

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
