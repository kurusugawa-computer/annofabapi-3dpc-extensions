[project]
name = "annofabapi-3dpc-extensions"
dynamic = ["version"]
description = "annofabapiの3DPC Editor用の拡張機能です。"
authors = [{ name = "Kurusugawa Computer Inc." }]
requires-python = ">=3.9,<4"
readme = "README.md"
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Developers", "Topic :: Utilities", "Operating System :: OS Independent"]
dependencies = ["dataclasses-json", "numpy"]

[project.urls]
Repository = "https://github.com/kurusugawa-computer/annofabapi-3dpc-extensions"

[dependency-groups]
test = ["pytest>=8,<9", "pytest-xdist", "annofabapi>=0.47.0"]
linter = ["ruff>=0.8,<0.9", "mypy>=1,<3", "pylint>=3,<4"]
documentation = ["sphinx>=8,<9", "pydata-sphinx-theme>=0.13"]
dev-only = ["numpy>=2.1; python_version >= '3.13'"]

[tool.uv]
required-version = ">=0.13.4"
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
default-groups = ["test", "linter", "documentation", "dev-only"]

[tool.uv.dependency-groups]
linter = { requires-python = ">=3.11" }
documentation = { requires-python = ">=3.11" }

[tool.mypy]
ignore_missing_imports = true

check_untyped_defs = true

plugins = "numpy.typing.mypy_plugin"

[tool.ruff]
target-version = "py39"
line-length = 120


[tool.ruff.lint]
ignore = [
    "G004", # `logging-f-string` : loggingでf-stringを使いたいので無視する
    "PD901", #すでに`df`という変数をいろんなところで使っているため
    "PD002", #すでにpandasで`inplace=True`はいろんなところで使っているため
    "RUF001", # 全角記号など`ambiguous unicode character`も使いたいため
    "RUF002",# 全角記号など`ambiguous unicode character`も使いたいため
    "RUF003",# 全角記号など`ambiguous unicode character`も使いたいため
    "PLC1901", # compare-to-empty-string : `if a == "`のように空文字列で直接比較したいときがあるため
    "PLR2004", # magic-value-comparison: listのサイズで判定するときがよくあるため
    "ERA", # : 役立つこともあるが、コメントアウトしていないコードも警告されるので無視する
    "PERF203", # try-except-in-loop: ループ内でtry-exceptを使うこともあるため無視する。
    "FIX", # TODOやFIXMEを使うため無視する
    "TD", # TODOコメントの書き方に気にしていないので無視する

    # 以下のルールはプロジェクトのコードに合っていないので無効化した
    "RSE", # flake8-raise
    "D", # pydocstyle, Docstringを中途半端にしか書いていないので、除外する
    "C90", # mccabe
    "T20", # flake8-print
    "SLF", #  flake8-self
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "TRY", # tryceratops
    "COM", # flake8-commas
    "S", # flake8-bandit
    "EM",#flake8-errmsg
    "EXE", # flake8-executable
    "ICN", # flake8-import-conventions
    "RET",#flake8-return
    "SIM",#flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", #pathlibを使わないコードが多いので、除外する
    "ISC", #flake8-implicit-str-concat
    "N", # pep8-naming
    "PT", # flake8-pytest-style
]

select = [
    "ALL"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
# `typing.Optional`を使っているため、UP007のルールを無視する
# https://beta.ruff.rs/docs/settings/#keep-runtime-typing
# Python 3.9のサポートを終了したら、この設定を除去する
keep-runtime-typing = true

[tool.ruff.lint.pylint]
max-args = 10

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["annofab_3dpc"]

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
