name: Python tests and lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          version: "latest"
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Test
        run: |
            uv run --locked --no-default-groups --group test pytest -n auto tests
          
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          version: "latest"
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group linter
      - name: Lint
        run: |
            make lint
      
